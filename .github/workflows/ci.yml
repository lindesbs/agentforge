name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  inspector:
    name: Go inspector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run inspector tests
        run: go test -race ./internal/inspector/... ./internal/editor/...

  frontend:
    name: Vue typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build

  desktop:
    name: Linux desktop compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Build frontend assets
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build
      - name: Compile desktop app
        run: go build -tags webkit2_41 -o /tmp/agentforge .
