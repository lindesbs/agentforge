name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:

jobs:
  inspector:
    name: Go inspector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run inspector tests
        run: go test -mod=readonly -race ./internal/...

  frontend:
    name: Vue typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Install browser for UI checks
        run: npx playwright install --with-deps chromium
      - name: Check workspace interactions and accessibility
        run: npm run test:ui
      - name: Upload failed UI test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ui-test-evidence
          path: build/ui-tests
          if-no-files-found: ignore

  desktop:
    name: Linux desktop compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Build frontend assets
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Resolve Go modules
        run: go mod download && go mod verify
      - name: Compile desktop app
        run: mkdir -p dist && CGO_ENABLED=1 go build -mod=readonly -tags 'production,webkit2_41' -trimpath -o dist/agentforge .
      - name: Check executable does not contain Wails build-tag stub
        run: |
          if strings dist/agentforge | grep -Fq 'Wails applications will not build without the correct build tags'; then
            echo 'Desktop binary contains Wails build-tag stub' >&2
            exit 1
          fi
      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-linux-amd64
          path: dist/agentforge
          if-no-files-found: error
